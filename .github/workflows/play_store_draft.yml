name: Deploy Draft to Play Store

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Java & Flutter
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x" # Or your specific version
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # 2. Quality gate - stop before touching signing secrets or building
      # if analysis/tests fail. --no-fatal-infos so info-level lints (e.g.
      # deprecation notices) don't block a release; only warnings/errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # 4. Decode Keystore and Create key.properties
      - name: Prepare Signing Credentials
        run: |
          # 1. Decode the keystore into the android/app folder
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          # 2. Create key.properties using a relative path
          # We use 'upload-keystore.jks' because Gradle looks relative to the 'app' module
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 5. Build the App Bundle
      - name: Build Android Release Bundle
        run: flutter build appbundle --release

      # 6. Upload to Google Play Console as Draft
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.pocket_guard.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: draft
