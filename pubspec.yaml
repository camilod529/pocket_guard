name: pocket_guard
description: "A personal finance manager app to help you take control of your money."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.1
  intl: ^0.20.2
  path: ^1.9.1
  uuid: ^4.5.2
  logger: ^2.6.2
  sqlite3: ^2.9.4
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  formz: ^0.8.0
  animate_do: ^4.2.0
  shared_preferences: ^2.5.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner:
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_size: 1024
    background_color: "#222d48"
    theme_mode: light
  windows:
    generate: true
    image_size: 512
    icon_size: 256
  macos:
    generate: true
    image_size: 1024
